@font-face{font-family:Inter;src:url('assets/inter.woff2')}*{box-sizing:border-box}html,body{margin:0;background:#0a0908;color:#fff;overflow:hidden;font-family:Inter,Arial,sans-serif}#stage{position:relative;width:960px;height:540px;overflow:hidden;background:radial-gradient(ellipse at 80% 30%,#2c251a 0%,#11100e 40%,#0a0908 80%);transform-origin:top left}#stage::after{content:'';position:absolute;inset:0;border:1px solid #ffffff18;pointer-events:none}header{position:absolute;left:40px;right:40px;top:24px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2.5px;color:#aaa;text-transform:uppercase}header b{color:#eeb057;font-size:12px;letter-spacing:1.8px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-1px;font-size:36px;line-height:1.12;margin:0;white-space:pre-line}#title{position:absolute;left:40px;top:65px;right:40px}#subtitle{position:absolute;left:40px;bottom:44px;right:40px;font-size:15px;color:#bcb7ae;line-height:1.5}#visual{position:absolute;left:40px;top:124px;width:880px;height:328px;overflow:hidden;border-radius:8px;background:#090908;box-shadow:0 20px 70px #0008}#visual img{width:100%;height:100%;object-fit:contain;transform-origin:center}#accent{position:absolute;left:40px;bottom:28px;width:54px;height:2px;background:#eeb057}#progress{position:absolute;bottom:0;left:0;height:3px;background:#eeb057}#number{position:absolute;right:40px;bottom:26px;font-size:10px;color:#aaa;letter-spacing:2px}.hook #title{top:130px;width:490px;font-size:54px}.hook #visual{left:590px;top:100px;width:300px;height:330px;border:6px solid #eeb05722;transform:rotate(2deg)}.hook #visual img{object-fit:cover}.hook #subtitle{width:470px;bottom:100px}.hook #number:before{content:'SHARED REPORT · IDENTIFYING DETAILS CROPPED';font-size:8px;letter-spacing:1px}.community #title{top:100px;width:330px;font-size:49px}.community #subtitle{width:290px;bottom:120px}.community #visual{left:390px;top:80px;width:530px;height:380px;background:none;box-shadow:none </style></head><body><div id="stage"><header><b>PocketDNA</b><span id="chapter"></span></header><h1 id="title"></h1><div id="visual"></div><div id="subtitle"></div><div id="accent"></div><div id="number"></div><div id="progress"></div></div><script src="reel-clock.js"></script><script>
const SCENES=[{"start": 0, "end": 12, "layout": "hook", "title": "Percentages.\nBut where is the story?", "subtitle": "A DNA result is the beginning, not the explanation.", "asset": "result-crop.png"}, {"start": 12, "end": 25, "layout": "community", "title": "\u201cWhat does this mean?\u201d", "subtitle": "The same question brings people to ancestry communities.", "asset": ""}, {"start": 25, "end": 30, "layout": "bench", "title": "Meet PocketDNA.", "subtitle": "Your ancestry evidence becomes a short, cited documentary.", "asset": "08-pocketdna-bench.png"}, {"start": 30, "end": 38, "layout": "film", "title": "", "subtitle": "", "asset": "episode-poster.jpg"}, {"start": 38, "end": 58, "layout": "diagram", "title": "Privacy is built into the architecture.", "subtitle": "Raw genotypes stay in the browser. Findings cross the boundary.", "asset": "01-system-architecture.png"}, {"start": 58, "end": 73, "layout": "diagram", "title": "Two inputs. One evidence record.", "subtitle": "Screenshot extraction or deterministic raw-file analysis. Ancestry only.", "asset": "02-input-to-evidence.png"}, {"start": 73, "end": 92, "layout": "diagram", "title": "Muse is the documentary crew.", "subtitle": "Interpretation \u2192 direction \u2192 narrative audit \u2192 compliance audit.", "asset": "03-evidence-to-film.png"}, {"start": 92, "end": 100, "layout": "diagram", "title": "Every model call has guardrails.", "subtitle": "One adapter. Structured output. Validation. Budgets.", "asset": "05-muse-call-sequence.png"}, {"start": 100, "end": 110, "layout": "diagram", "title": "Writers do not grade their own work.", "subtitle": "Workers write. Auditors review. Deterministic code renders.", "asset": "04-agent-swimlane.png"}, {"start": 110, "end": 120, "layout": "diagram", "title": "The art department has an editor.", "subtitle": "Generate \u2192 audit \u2192 bounded repair \u2192 reviewed fallback.", "asset": "06-image-agent-state.png"}, {"start": 120, "end": 155, "layout": "film", "title": "", "subtitle": "", "asset": "episode-poster.jpg"}, {"start": 155, "end": 165, "layout": "evidence", "title": "A story you can inspect.", "subtitle": "Historical context is tied to sources. Similarity is not a traced genealogy.", "asset": "03-evidence-to-film.png"}, {"start": 165, "end": 175, "layout": "diagram", "title": "One Meta-powered film crew.", "subtitle": "Muse Spark \u00b7 Muse Image \u00b7 Muse Wonder \u00b7 Muse Code", "asset": "07-muse-model-map.png"}, {"start": 175, "end": 180, "layout": "close", "title": "From a DNA result\nto a story to share.", "subtitle": "PocketDNA \u00b7 Meta Global AI Developer Hackathon \u00b7 Solo Indie Track", "asset": "08-pocketdna-bench.png"}];
let active=-1;
HTMLReel.scene({shape:'16:9',dur:180,cover:0,async setup(){await document.fonts.ready;},draw(t){
 const i=SCENES.findIndex(s=>t>=s.start&&t<s.end);const index=i<0?SCENES.length-1:i;const s=SCENES[index];const u=Math.max(0,Math.min(1,(t-s.start)/(s.end-s.start)));
 if(active!==index){active=index;document.querySelector('#stage').className=s.layout;document.querySelector('#title').textContent=s.title;document.querySelector('#subtitle').textContent=s.subtitle;document.querySelector('#chapter').textContent=index===0?'From a result to a story':`${String(index+1).padStart(2,'0')} / THE DEMO`;document.querySelector('#number').textContent=s.layout==='hook'?'':`${String(index+1).padStart(2,'0')} / 14`;document.querySelector('#visual').innerHTML=s.layout==='community'?'<div class="grid">'+[1,2,3,5,6,7].map(j=>`<img src="assets/screen-${j}.png">`).join('')+'</div>':`<img src="assets/${s.asset}">`;}
 document.querySelector('#progress').style.width=`${t/180*100}%`;
 const imgs=document.querySelectorAll('#visual img');imgs.forEach((el,j)=>{
 if(s.layout==='diagram'){
  const local=t-s.start;const ramp=Math.min(1,Math.max(0,(local-1)/1.6));const tail=Math.min(1,(s.end-t)/1.4);const z=1+.8*Math.min(ramp,tail);
  const pan=(.5-u)*220*Math.min(ramp,tail);const vert=s.asset.startsWith('05')?(u-.5)*170:0;
  el.style.transform=`translate(${pan}px,${vert}px) scale(${z})`;el.style.filter='brightness(1.45)';
 }else{el.style.transform=`scale(${1+u*.04})`;el.style.filter=s.layout==='bench'||s.layout==='close'?'brightness(2.8)':'none';}
 });
 const entrance=Math.min(1,Math.max(0,(t-s.start)/.55));document.querySelector('#title').style.opacity=index===0?1:entrance;document.querySelector('#title').style.transform=`translateY(${index===0?0:(1-entrance)*8}px)`;
 return Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
}});
</script></body></html>
